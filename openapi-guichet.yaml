  /operations/{reference}/events:
    get:
      summary: Historique d'état d'une opération
      operationId: listOperationEvents
      tags: [Opérations]
      description: >
        Chaque changement d'état, dans l'ordre chronologique. Utile pour comprendre le
        parcours d'une opération lors d'un litige.
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
            example: GUI-CI-20261001-7K2M9QX4
      responses:
        "200":
          description: Historique.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        fromStatus:
                          oneOf:
                            - $ref: "#/components/schemas/OperationStatus"
                            - type: "null"
                          description: "`null` pour l'événement de création."
                        toStatus:
                          $ref: "#/components/schemas/OperationStatus"
                        reason:
                          type: [string, "null"]
                        occurredAt:
                          type: string
                          format: date-time
              example:
                items:
                  - fromStatus: null
                    toStatus: CREATED
                    reason: Opération enregistrée
                    occurredAt: "2026-10-01T10:12:04.000Z"
                  - fromStatus: CREATED
                    toStatus: AWAITING_PAYER
                    reason: Réponse de soumission
                    occurredAt: "2026-10-01T10:12:05.000Z"
                  - fromStatus: AWAITING_PAYER
                    toStatus: SUCCEEDED
                    reason: Confirmation reçue
                    occurredAt: "2026-10-01T10:13:47.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /merchants/signup:
    post:
      summary: Créer votre compte
      operationId: signup
      tags: [Compte]
      security: []
      description: |
        Crée votre compte, son portefeuille et votre première paire de clés.

        L'en-tête `x-admission-token` est obligatoire : il vous est transmis par votre
        référent Djonanko après accord. Cet endpoint n'est pas ouvert au public.

        <Warning>
        `apiSecret` et `webhookSecret` ne sont affichés **qu'une seule fois**.
        Enregistrez-les immédiatement dans votre gestionnaire de secrets — ils ne sont
        pas récupérables. En cas de perte, il faut émettre une nouvelle clé et faire
        tourner le secret de signature.
        </Warning>

        Le compte naît en statut `PENDING` : vous pouvez authentifier, consulter votre
        solde, configurer vos notifications et déclarer vos adresses IP, mais **pas
        encore opérer**. L'activation intervient après validation de votre dossier.
      parameters:
        - name: x-admission-token
          in: header
          required: true
          description: Jeton d'admission fourni par Djonanko.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, country]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 160
                  description: Nom commercial.
                  example: Wakati Technologies
                legalName:
                  type: string
                  maxLength: 200
                  description: Raison sociale au registre du commerce.
                  example: Wakati Technologies SARL
                email:
                  type: string
                  format: email
                  maxLength: 180
                  description: >
                    Adresse de contact technique. Unique : elle identifie votre compte.
                  example: tech@wakati.ci
                phoneNumber:
                  type: string
                  maxLength: 24
                  example: "+2250700000000"
                country:
                  $ref: "#/components/schemas/Country"
                webhookUrl:
                  type: string
                  format: uri
                  description: >
                    URL HTTPS de réception des notifications. Configurable ensuite via
                    `PATCH /merchants/me`.
                  example: https://wakati.ci/hooks/djonanko
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Compte créé.
          content:
            application/json:
              schema:
                type: object
                properties:
                  merchant:
                    $ref: "#/components/schemas/Merchant"
                  credentials:
                    type: object
                    properties:
                      apiKey:
                        type: string
                        example: gk_live_4f7k2m9q1a2b3c4d5e6f7a8b
                      apiSecret:
                        type: string
                        description: Affiché une seule fois.
                        example: gs_live_…
                      environment:
                        type: string
                        enum: [live, test]
                  webhookSecret:
                    type: string
                    description: >
                      Secret de signature de vos notifications. Affiché une seule fois.
                    example: whsec_…
                  notice:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Jeton d'admission invalide (`ADMISSION_DENIED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /merchants/me:
    get:
      summary: Consulter votre compte
      operationId: getMe
      tags: [Compte]
      description: >
        Statut, pays ouverts, barème et plafonds applicables à votre compte.
      responses:
        "200":
          description: Votre compte.
          content:
            application/json:
              schema:
                type: object
                properties:
                  merchant:
                    $ref: "#/components/schemas/Merchant"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Modifier votre compte
      operationId: updateMe
      tags: [Compte]
      description: >
        Seuls ces champs sont modifiables. Le barème, les plafonds, les pays ouverts et
        le statut sont contractuels : leur évolution passe par votre référent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 160
                phoneNumber:
                  type: string
                  maxLength: 24
                webhookUrl:
                  type: string
                  format: uri
                  description: URL HTTPS de réception des notifications.
                metadata:
                  type: object
                  additionalProperties: true
            example:
              webhookUrl: https://wakati.ci/hooks/djonanko-v2
      responses:
        "200":
          description: Compte mis à jour.
          content:
            application/json:
              schema:
                type: object
                properties:
                  merchant:
                    $ref: "#/components/schemas/Merchant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /merchants/me/credentials:
    get:
      summary: Lister vos clés d'API
      operationId: listCredentials
      tags: [Compte]
      description: Les secrets ne sont jamais renvoyés.
      responses:
        "200":
          description: Vos clés.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        apiKey:
                          type: string
                          example: gk_live_4f7k2m9q1a2b3c4d5e6f7a8b
                        environment:
                          type: string
                          enum: [live, test]
                        label:
                          type: [string, "null"]
                        inUse:
                          type: boolean
                          description: >
                            `true` pour la clé présentée sur cet appel. Permet de ne
                            pas révoquer celle qui fait tourner votre production.
                        lastUsedAt:
                          type: [string, "null"]
                          format: date-time
                        revokedAt:
                          type: [string, "null"]
                          format: date-time
                        expiresAt:
                          type: [string, "null"]
                          format: date-time
                        createdAt:
                          type: string
                          format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Émettre une nouvelle paire de clés
      operationId: createCredential
      tags: [Compte]
      description: |
        Pour une rotation sans coupure : émettez la nouvelle paire, déployez-la, puis
        révoquez l'ancienne. Plusieurs paires peuvent être actives simultanément.

        <Warning>
        Le secret n'est affiché qu'une seule fois.
        </Warning>
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 80
                  description: Libellé pour distinguer cette paire des autres.
                  example: backend production 2026-10
                environment:
                  type: string
                  enum: [live, test]
                  default: live
                  description: >
                    Une clé `test` authentifie et permet la consultation, mais est
                    refusée sur les endpoints qui déplacent de l'argent réel.
      responses:
        "201":
          description: Paire émise.
          content:
            application/json:
              schema:
                type: object
                properties:
                  credential:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      apiKey:
                        type: string
                      apiSecret:
                        type: string
                        description: Affiché une seule fois.
                      environment:
                        type: string
                      label:
                        type: [string, "null"]
                      createdAt:
                        type: string
                        format: date-time
                  notice:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /merchants/me/credentials/{id}:
    delete:
      summary: Révoquer une clé
      operationId: revokeCredential
      tags: [Compte]
      description: >
        La dernière clé active ne peut pas être révoquée : vous perdriez tout accès au
        compte. Émettez d'abord la remplaçante.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Clé révoquée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  credential:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      apiKey:
                        type: string
                      revokedAt:
                        type: string
                        format: date-time
        "400":
          description: Dernière clé active — révocation refusée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /merchants/me/wallet:
    get:
      summary: Consulter votre portefeuille
      operationId: getWallet
      tags: [Portefeuille]
      description: |
        Portefeuille unique : les encaissements le créditent, les transferts le
        débitent.

        `available = balance − reserved`, où `reserved` est la part immobilisée par vos
        transferts en cours. **C'est `available` qui détermine ce que vous pouvez
        engager**, pas `balance`.
      responses:
        "200":
          description: Votre portefeuille.
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet:
                    $ref: "#/components/schemas/Wallet"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /merchants/me/wallet/statement:
    get:
      summary: Relevé de portefeuille
      operationId: getStatement
      tags: [Portefeuille]
      description: >
        Chaque mouvement, du plus récent au plus ancien. Chaque ligne porte le solde
        après écriture (`balanceAfter`), ce qui permet un rapprochement ligne à ligne
        avec votre comptabilité.
      parameters:
        - name: direction
          in: query
          schema:
            type: string
            enum: [CREDIT, DEBIT, HOLD, RELEASE]
        - name: kind
          in: query
          schema:
            type: string
            enum:
              [
                CASHIN_CREDIT,
                CASHIN_FEE,
                CASHOUT_HOLD,
                CASHOUT_DEBIT,
                CASHOUT_FEE,
                CASHOUT_RELEASE,
                REVERSAL_CREDIT,
                REVERSAL_DEBIT,
                ADJUSTMENT_CREDIT,
                ADJUSTMENT_DEBIT,
              ]
        - name: operationReference
          in: query
          description: Pour isoler les mouvements d'une opération donnée.
          schema:
            type: string
            maxLength: 48
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page de relevé.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/LedgerEntry"
              example:
                total: 1842
                limit: 50
                offset: 0
                items:
                  - id: 3b8e1f2a-9c4d-4e6f-8a1b-2c3d4e5f6a7b
                    sequence: 1842
                    direction: DEBIT
                    kind: CASHOUT_FEE
                    amount: 250
                    currency: XOF
                    balanceAfter: 474750
                    reservedAfter: 0
                    operationReference: GUI-CO-20261001-4F7K2M9Q
                    description: Commission sur transfert GUI-CO-20261001-4F7K2M9Q
                    createdAt: "2026-10-01T11:04:02.000Z"
                  - id: 2a7d0e1b-8b3c-4d5e-9f0a-1b2c3d4e5f6a
                    sequence: 1841
                    direction: DEBIT
                    kind: CASHOUT_DEBIT
                    amount: 25000
                    currency: XOF
                    balanceAfter: 475000
                    reservedAfter: 0
                    operationReference: GUI-CO-20261001-4F7K2M9Q
                    description: Transfert GUI-CO-20261001-4F7K2M9Q
                    createdAt: "2026-10-01T11:04:02.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /merchants/me/allowed-ips:
    get:
      summary: Lister vos adresses IP autorisées
      operationId: listAllowedIps
      tags: [Sécurité]
      responses:
        "200":
          description: Vos adresses déclarées.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    enum: [off, observe, enforce]
                    description: >
                      Régime d'application courant. En `enforce`, un appel depuis une
                      adresse non déclarée est refusé.
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        cidr:
                          type: string
                          example: 41.207.12.0/24
                        label:
                          type: [string, "null"]
                        createdAt:
                          type: string
                          format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Déclarer une adresse IP autorisée
      operationId: createAllowedIp
      tags: [Sécurité]
      description: >
        Déclarez les adresses depuis lesquelles vos serveurs appellent. C'est un second
        facteur de fait : une clé volée ne sert à rien si elle doit être présentée
        depuis votre infrastructure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cidr]
              properties:
                cidr:
                  type: string
                  description: >
                    Adresse IPv4 seule, ou plage en notation CIDR. IPv4 uniquement.
                  example: 41.207.12.34
                label:
                  type: string
                  maxLength: 120
                  example: passerelle sortante Abidjan
      responses:
        "201":
          description: Adresse déclarée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowedIp:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      cidr:
                        type: string
                      label:
                        type: [string, "null"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /merchants/me/allowed-ips/{id}:
    delete:
      summary: Retirer une adresse IP autorisée
      operationId: deleteAllowedIp
      tags: [Sécurité]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Adresse retirée.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /merchants/me/ip-check:
    get:
      summary: Vérifier l'adresse IP vue par Djonanko
      operationId: ipCheck
      tags: [Sécurité]
      description: >
        Indique depuis quelle adresse nous vous voyons appeler et si elle est
        autorisée. Utile derrière un NAT ou un proxy sortant, quand vous ne savez pas
        quelle adresse déclarer. **Cet endpoint n'est jamais soumis au filtrage par
        IP** : il reste accessible même après un refus.
      responses:
        "200":
          description: Diagnostic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientIp:
                    type: string
                    example: 41.207.12.34
                  mode:
                    type: string
                    enum: [off, observe, enforce]
                  allowed:
                    type: boolean
                  declaredCount:
                    type: integer
                  declared:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /merchants/me/webhook-secret/rotate:
    post:
      summary: Renouveler votre secret de signature
      operationId: rotateWebhookSecret
      tags: [Notifications]
      description: |
        <Warning>
        **Coupure immédiate.** Les notifications sont signées avec le nouveau secret dès
        cet appel ; l'ancien n'est plus valable. Déployez le nouveau sans délai, sinon
        vos vérifications de signature échoueront.
        </Warning>
      responses:
        "201":
          description: Nouveau secret.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhookSecret:
                    type: string
                    description: Affiché une seule fois.
                    example: whsec_…
                  notice:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /merchants/me/webhooks:
    get:
      summary: Lister vos notifications en échec
      operationId: listWebhookDeliveries
      tags: [Notifications]
      description: >
        Par défaut, les notifications en attente de rejeu et celles abandonnées. La
        charge complète est incluse : vous pouvez la traiter sans attendre un rejeu.
      parameters:
        - name: status
          in: query
          description: >
            `FAILED` (rejeu programmé), `ABANDONED` (définitif), `SUCCESS` ou
            `PENDING`. À défaut, `FAILED` et `ABANDONED`.
          schema:
            type: string
            enum: [PENDING, SUCCESS, FAILED, ABANDONED]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page de notifications.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        eventId:
                          type: string
                          example: evt_9f1c2b7e4a5d4c8fb0a1e2d3c4b5a697
                        eventType:
                          type: string
                          example: cashin.succeeded
                        operationReference:
                          type: [string, "null"]
                        status:
                          type: string
                          enum: [PENDING, SUCCESS, FAILED, ABANDONED]
                        attempts:
                          type: integer
                        maxAttempts:
                          type: integer
                        lastHttpStatus:
                          type: [integer, "null"]
                          description: Code renvoyé par votre serveur à la dernière tentative.
                        lastError:
                          type: [string, "null"]
                        nextRetryAt:
                          type: [string, "null"]
                          format: date-time
                        deliveredAt:
                          type: [string, "null"]
                          format: date-time
                        createdAt:
                          type: string
                          format: date-time
                        payload:
                          type: object
                          additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /merchants/me/webhooks/{id}/replay:
    post:
      summary: Rejouer une notification
      operationId: replayWebhookDelivery
      tags: [Notifications]
      description: >
        Renvoie la notification à l'identique, avec une signature réhorodatée. Une
        notification déjà livrée ne peut pas être rejouée.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Tentative effectuée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivered:
                    type: boolean
                    description: "`true` si votre serveur a répondu 2xx."
                  delivery:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                      attempts:
                        type: integer
                      lastHttpStatus:
                        type: [integer, "null"]
                      lastError:
                        type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Notification déjà livrée (`WEBHOOK_ALREADY_DELIVERED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /merchants/me/webhooks/test:
    post:
      summary: Envoyer une notification de test
      operationId: testWebhook
      tags: [Notifications]
      description: >
        Envoie un événement `ping` signé à votre URL. À utiliser pour valider votre
        endpoint et votre vérification de signature **avant** votre première opération
        réelle.
      responses:
        "201":
          description: Tentative effectuée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivered:
                    type: boolean
                  url:
                    type: [string, "null"]
                  hint:
                    type: string
                    description: Piste de diagnostic si la livraison a échoué.
        "401":
          $ref: "#/components/responses/Unauthorized"
