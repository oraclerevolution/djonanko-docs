paths:
  /cashin:
    post:
      summary: Encaisser un paiement
      operationId: createCashin
      tags: [Encaissement]
      description: |
        Débite le compte mobile money du payeur et crédite votre portefeuille du
        montant net une fois l'encaissement confirmé.

        Deux comportements selon l'opérateur :

        | Opérateurs | Statut renvoyé | Ce que vous avez à faire |
        |---|---|---|
        | MTN, Moov | `PENDING` | Rien. Le payeur reçoit une demande de validation sur son téléphone. Attendez la notification. |
        | Orange, Wave, Djamo | `AWAITING_PAYER` | **Envoyer votre client sur `payerActionUrl`.** Sans cela l'encaissement n'aboutira jamais. |

        L'issue définitive arrive par notification (`cashin.succeeded` /
        `cashin.failed`). Une opération sans issue au bout de 30 minutes passe en
        `EXPIRED`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, country, operator, payerPhone]
              properties:
                amount:
                  type: integer
                  minimum: 1
                  description: >
                    Montant à encaisser, en unités entières. Aucune décimale.
                  example: 5000
                country:
                  $ref: "#/components/schemas/Country"
                operator:
                  $ref: "#/components/schemas/Operator"
                payerPhone:
                  type: string
                  maxLength: 24
                  description: >
                    Numéro du payeur. Format national ou international, avec ou sans
                    espaces — il est normalisé en E.164.
                  example: "0701020304"
                payerName:
                  type: string
                  maxLength: 160
                  example: Aya Koné
                externalReference:
                  type: string
                  maxLength: 120
                  description: >
                    Votre identifiant d'opération. Unique sur votre compte : une
                    seconde opération portant la même valeur est refusée en `409`.
                    C'est votre garde-fou contre le double encaissement.
                  example: CMD-2026-00184
                description:
                  type: string
                  maxLength: 200
                  example: Commande 184
                callbackUrl:
                  type: string
                  format: uri
                  description: >
                    URL de notification propre à cette opération. À défaut, celle de
                    votre compte est utilisée. HTTPS obligatoire.
                successUrl:
                  type: string
                  format: uri
                  description: >
                    Où renvoyer le payeur après un paiement réussi, quand une
                    redirection est nécessaire.
                errorUrl:
                  type: string
                  format: uri
                  description: Où renvoyer le payeur en cas d'échec.
                metadata:
                  type: object
                  additionalProperties: true
                  description: >
                    Données libres, restituées telles quelles dans les notifications.
                  example:
                    cartId: c_8891
            examples:
              pushUssd:
                summary: Orange Côte d'Ivoire
                value:
                  amount: 5000
                  country: CI
                  operator: ORANGE
                  payerPhone: "0701020304"
                  payerName: Aya Koné
                  externalReference: CMD-2026-00184
                  description: Commande 184
                  metadata:
                    cartId: c_8891
              minimal:
                summary: Champs obligatoires seulement
                value:
                  amount: 1000
                  country: CI
                  operator: MTN
                  payerPhone: "0501020304"
      responses:
        "201":
          description: Opération créée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationEnvelope"
              examples:
                attenteDuPayeur:
                  summary: Redirection nécessaire
                  value:
                    operation:
                      reference: GUI-CI-20261001-7K2M9QX4
                      type: CASHIN
                      status: AWAITING_PAYER
                      amount: 5000
                      fees: 75
                      netAmount: 4925
                      currency: XOF
                      country: CI
                      operator: ORANGE
                      counterparty:
                        phoneNumber: "+2250701020304"
                        name: Aya Koné
                      externalReference: CMD-2026-00184
                      description: Commande 184
                      payerActionUrl: https://pay.example.com/s/abc123
                      requiresPayerAction: true
                      failure: null
                      metadata:
                        cartId: c_8891
                      createdAt: "2026-10-01T10:12:04.000Z"
                      updatedAt: "2026-10-01T10:12:05.000Z"
                      completedAt: null
                      expiresAt: "2026-10-01T10:42:04.000Z"
                enAttente:
                  summary: Validation sur le téléphone du payeur
                  value:
                    operation:
                      reference: GUI-CI-20261001-9P3R5T7V
                      type: CASHIN
                      status: PENDING
                      amount: 1000
                      fees: 15
                      netAmount: 985
                      currency: XOF
                      country: CI
                      operator: MTN
                      counterparty:
                        phoneNumber: "+2250501020304"
                        name: null
                      externalReference: null
                      description: null
                      payerActionUrl: null
                      requiresPayerAction: false
                      failure: null
                      metadata: null
                      createdAt: "2026-10-01T10:14:11.000Z"
                      updatedAt: "2026-10-01T10:14:12.000Z"
                      completedAt: null
                      expiresAt: "2026-10-01T10:44:11.000Z"
        "200":
          description: >
            Rejeu idempotent : cette `Idempotency-Key` a déjà été traitée, la réponse
            initiale est renvoyée sans rien réexécuter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"

  /cashout/quote:
    get:
      summary: Chiffrer un transfert
      operationId: quoteCashout
      tags: [Transfert]
      description: |
        Renvoie la commission, le total qui sera prélevé et l'état de votre
        portefeuille, sans rien engager.

        <Note>
        Le devis est **indicatif**. Le contrôle de solde qui compte a lieu à la
        création du transfert : entre les deux, un autre de vos transferts peut avoir
        consommé le disponible.
        </Note>

        Accessible avec une clé de test.
      parameters:
        - name: amount
          in: query
          required: true
          description: Montant à transférer, en unités entières.
          schema:
            type: integer
            minimum: 1
            example: 25000
      responses:
        "200":
          description: Devis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount:
                    type: integer
                    example: 25000
                  fees:
                    type: integer
                    example: 250
                  totalToDebit:
                    type: integer
                    description: Ce qui sera immobilisé puis prélevé (`amount + fees`).
                    example: 25250
                  currency:
                    $ref: "#/components/schemas/Currency"
                  wallet:
                    type: object
                    properties:
                      available:
                        type: integer
                        example: 480000
                      balance:
                        type: integer
                        example: 500000
                      reserved:
                        type: integer
                        example: 20000
                  sufficient:
                    type: boolean
                    description: "`true` si `available >= totalToDebit` à cet instant."
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /cashout:
    post:
      summary: Transférer vers un compte mobile money
      operationId: createCashout
      tags: [Transfert]
      description: |
        Verse le montant au bénéficiaire et prélève votre portefeuille du montant plus
        la commission.

        ### Immobilisation

        Dès l'acceptation, le montant **et** la commission sont *immobilisés* : ils
        quittent votre solde disponible sans encore être débités.

        - transfert **exécuté** → ils sont débités, `balance` diminue ;
        - transfert **échoué** → l'immobilisation est levée, votre solde retrouve son
          niveau.

        C'est ce mécanisme qui vous empêche d'engager deux fois le même solde pendant
        qu'un transfert est en cours.

        L'issue définitive arrive par notification (`cashout.succeeded` /
        `cashout.failed`). Un transfert sans issue au bout de 6 heures passe en
        `EXPIRED` et l'immobilisation est levée.

        <Warning>
        Cet endpoint exige une clé de production (`gk_live_`). Une clé de test est
        refusée.
        </Warning>
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, country, operator, beneficiaryPhone, beneficiaryName]
              properties:
                amount:
                  type: integer
                  minimum: 1
                  description: Montant à verser au bénéficiaire, en unités entières.
                  example: 25000
                country:
                  $ref: "#/components/schemas/Country"
                operator:
                  $ref: "#/components/schemas/Operator"
                beneficiaryPhone:
                  type: string
                  maxLength: 24
                  description: Numéro mobile money du bénéficiaire.
                  example: "0501020304"
                beneficiaryName:
                  type: string
                  maxLength: 160
                  description: >
                    Nom du bénéficiaire. Exigé par les opérateurs et repris sur votre
                    relevé.
                  example: Koffi Yao
                externalReference:
                  type: string
                  maxLength: 120
                  description: >
                    Votre identifiant d'opération. Unique sur votre compte : c'est
                    votre garde-fou contre le double décaissement.
                  example: PAIE-2026-03-0042
                description:
                  type: string
                  maxLength: 200
                  example: Salaire mars 2026
                callbackUrl:
                  type: string
                  format: uri
                  description: URL de notification propre à cette opération. HTTPS obligatoire.
                metadata:
                  type: object
                  additionalProperties: true
            examples:
              salaire:
                summary: Transfert Wave
                value:
                  amount: 25000
                  country: CI
                  operator: WAVE
                  beneficiaryPhone: "0501020304"
                  beneficiaryName: Koffi Yao
                  externalReference: PAIE-2026-03-0042
                  description: Salaire mars 2026
      responses:
        "201":
          description: Transfert accepté et immobilisation posée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationEnvelope"
              example:
                operation:
                  reference: GUI-CO-20261001-4F7K2M9Q
                  type: CASHOUT
                  status: PENDING
                  amount: 25000
                  fees: 250
                  netAmount: 25250
                  currency: XOF
                  country: CI
                  operator: WAVE
                  counterparty:
                    phoneNumber: "+2250501020304"
                    name: Koffi Yao
                  externalReference: PAIE-2026-03-0042
                  description: Salaire mars 2026
                  payerActionUrl: null
                  requiresPayerAction: false
                  failure: null
                  metadata: null
                  createdAt: "2026-10-01T11:01:50.000Z"
                  updatedAt: "2026-10-01T11:01:52.000Z"
                  completedAt: null
                  expiresAt: "2026-10-01T17:01:50.000Z"
        "200":
          description: Rejeu idempotent — la réponse initiale est renvoyée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"

  /operations:
    get:
      summary: Lister vos opérations
      operationId: listOperations
      tags: [Opérations]
      description: Encaissements et transferts confondus, les plus récents d'abord.
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/OperationType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OperationStatus"
        - name: country
          in: query
          schema:
            $ref: "#/components/schemas/Country"
        - name: operator
          in: query
          schema:
            $ref: "#/components/schemas/Operator"
        - name: externalReference
          in: query
          description: Votre propre référence d'opération.
          schema:
            type: string
            maxLength: 120
        - name: from
          in: query
          description: Borne basse de création, au format ISO 8601.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Borne haute de création, au format ISO 8601.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page d'opérations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 184
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /operations/{reference}:
    get:
      summary: Consulter une opération
      operationId: getOperation
      tags: [Opérations]
      description: |
        **Source de vérité sur l'état d'une opération.** À interroger si une
        notification ne vous est pas parvenue, plutôt que de l'attendre indéfiniment.
      parameters:
        - name: reference
          in: path
          required: true
          description: Référence Djonanko de l'opération.
          schema:
            type: string
            example: GUI-CI-20261001-7K2M9QX4
      responses:
        "200":
          description: L'opération.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationEnvelope"
