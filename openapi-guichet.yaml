openapi: 3.1.0
info:
  title: Djonanko Guichet API
  version: "1.0.0"
  description: |
    API d'agrégation mobile money de Djonanko. Elle permet à une entreprise
    partenaire d'**encaisser** (`cash-in`) et de **transférer** (`cash-out`) sur les
    réseaux mobile money d'Afrique de l'Ouest et du Centre, directement depuis ses
    propres serveurs.

    Contrairement à l'API Djonanko Pay, le Guichet ne passe **ni par un lien de
    paiement ni par une page hébergée** : vous appelez l'API, le client est sollicité
    sur son téléphone, et vous recevez l'issue par notification signée.

    ### Ce qu'il faut retenir avant de commencer

    - **Authentification** : `x-api-key` + `x-api-secret` sur chaque appel.
    - **Montants entiers** : le XOF, le XAF et le GNF n'ont pas de sous-unité.
      `5000` vaut 5 000 FCFA. Aucune décimale n'est acceptée.
    - **Idempotence obligatoire** : l'en-tête `Idempotency-Key` est exigé sur
      `POST /cashin` et `POST /cashout`.
    - **Un portefeuille unique** par compte : les encaissements le créditent, les
      transferts le débitent.
    - **Notifications signées** : vérifiez l'en-tête `Djonanko-Signature` avant de
      traiter.

    Toutes les réponses sont en JSON. Chaque réponse porte un en-tête
    `x-request-id` à citer dans vos demandes de support.
  contact:
    name: Support Djonanko
    url: https://www.djonanko.ci/#contact

servers:
  - url: https://guichet.apidjonanko.tech/v1
    description: Production

tags:
  - name: Encaissement
    description: Débiter un compte mobile money vers votre portefeuille.
  - name: Transfert
    description: Créditer un compte mobile money depuis votre portefeuille.
  - name: Opérations
    description: Consulter l'état et l'historique de vos opérations.
  - name: Portefeuille
    description: Solde et relevé des mouvements.
  - name: Compte
    description: Création de compte, profil, clés d'API.
  - name: Sécurité
    description: Adresses IP autorisées.
  - name: Notifications
    description: Configuration, supervision et rejeu des notifications sortantes.

security:
  - ApiKey: []
    ApiSecret: []

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Votre clé publique, préfixée `gk_live_` (ou `gk_test_`).
    ApiSecret:
      type: apiKey
      in: header
      name: x-api-secret
      description: >
        Votre secret, préfixé `gs_live_` (ou `gs_test_`). Affiché une seule fois, à
        l'émission de la clé. Il ne doit jamais quitter vos serveurs.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Clé unique de votre côté, propre à cette intention d'opération. Un second
        appel portant la même clé et le même corps renvoie la réponse initiale sans
        rien réexécuter. 120 caractères maximum, conservée 24 heures.
      schema:
        type: string
        maxLength: 120
        example: cmd-184-tentative-1
    RequestId:
      name: x-request-id
      in: header
      required: false
      description: >
        Identifiant de corrélation de votre choix. Repris tel quel dans la réponse et
        dans nos journaux. À défaut, nous en générons un.
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      required: false
      description: Nombre maximum d'éléments renvoyés.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: Nombre d'éléments à ignorer avant de commencer la page.
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:
    Country:
      type: string
      description: Pays, en ISO 3166-1 alpha-2.
      enum: [CI, BF, ML, SN, TG, BJ, NE, CM, GN]
      example: CI

    Currency:
      type: string
      description: >
        Devise. Aucune n'a de sous-unité : les montants sont toujours des entiers.
      enum: [XOF, XAF, GNF]
      example: XOF

    Operator:
      type: string
      description: >
        Opérateur mobile money. Tous ne sont pas disponibles dans tous les pays —
        voir le guide « Pays et opérateurs ».
      enum: [ORANGE, MTN, MOOV, WAVE, DJAMO]
      example: ORANGE

    OperationType:
      type: string
      enum: [CASHIN, CASHOUT]

    OperationStatus:
      type: string
      description: |
        État d'une opération.

        - `CREATED` — enregistrée, pas encore soumise
        - `PENDING` — soumise, en attente d'issue
        - `AWAITING_PAYER` — encaissement : le payeur doit agir
        - `SUCCEEDED` — aboutie *(définitif)*
        - `FAILED` — refusée *(définitif)*
        - `EXPIRED` — aucune issue dans le délai *(définitif)*
        - `CANCELLED` — annulée avant exécution *(définitif)*
        - `REVERSED` — contre-passée *(définitif)*

        Une opération réussie ne repasse jamais en échec. Le seul mouvement possible
        depuis `SUCCEEDED` est `REVERSED`.
      enum:
        [
          CREATED,
          PENDING,
          AWAITING_PAYER,
          SUCCEEDED,
          FAILED,
          EXPIRED,
          CANCELLED,
          REVERSED,
        ]

    OperationFailureCode:
      type: string
      description: |
        Cause de l'échec d'une opération.

        - `OPERATOR_INSUFFICIENT_FUNDS` — solde mobile money insuffisant
        - `OPERATOR_ACCOUNT_UNKNOWN` — compte inconnu ou inactif
        - `OPERATOR_ACCOUNT_LIMIT_REACHED` — plafond du compte atteint
        - `PAYER_CANCELLED` — le payeur a refusé
        - `OPERATOR_TIMEOUT` — l'opérateur n'a pas répondu
        - `OPERATOR_REFUSED` — refus sans motif précis
        - `UPSTREAM_UNAVAILABLE` — indisponibilité temporaire
        - `SETTLEMENT_ACCOUNT_UNAVAILABLE` — indisponibilité temporaire côté Djonanko
        - `INTERNAL_ERROR` — erreur interne
      enum:
        [
          OPERATOR_INSUFFICIENT_FUNDS,
          OPERATOR_ACCOUNT_UNKNOWN,
          OPERATOR_ACCOUNT_LIMIT_REACHED,
          PAYER_CANCELLED,
          OPERATOR_TIMEOUT,
          OPERATOR_REFUSED,
          UPSTREAM_UNAVAILABLE,
          SETTLEMENT_ACCOUNT_UNAVAILABLE,
          INTERNAL_ERROR,
        ]

    Counterparty:
      type: object
      description: Le payeur sur un encaissement, le bénéficiaire sur un transfert.
      properties:
        phoneNumber:
          type: string
          description: Numéro normalisé au format E.164.
          example: "+2250701020304"
        name:
          type: [string, "null"]
          example: Aya Koné

    Operation:
      type: object
      description: >
        Représentation d'une opération. C'est la forme renvoyée par les endpoints de
        création, de consultation, et dans le corps des notifications.
      properties:
        reference:
          type: string
          description: >
            Référence Djonanko de l'opération. C'est l'identifiant à conserver et à
            citer. Préfixée `GUI-CI-` pour un encaissement, `GUI-CO-` pour un transfert.
          example: GUI-CI-20261001-7K2M9QX4
        type:
          $ref: "#/components/schemas/OperationType"
        status:
          $ref: "#/components/schemas/OperationStatus"
        amount:
          type: integer
          description: Montant demandé, en unités entières.
          example: 5000
        fees:
          type: integer
          description: Commission Djonanko, figée à la création de l'opération.
          example: 75
        netAmount:
          type: integer
          description: >
            Impact sur votre portefeuille. Sur un encaissement, ce qui vous est
            crédité (`amount − fees`). Sur un transfert, ce qui vous est prélevé
            (`amount + fees`).
          example: 4925
        currency:
          $ref: "#/components/schemas/Currency"
        country:
          $ref: "#/components/schemas/Country"
        operator:
          $ref: "#/components/schemas/Operator"
        counterparty:
          $ref: "#/components/schemas/Counterparty"
        externalReference:
          type: [string, "null"]
          description: Votre propre référence, telle que vous l'avez transmise.
          example: CMD-2026-00184
        description:
          type: [string, "null"]
          example: Commande 184
        payerActionUrl:
          type: [string, "null"]
          description: >
            URL sur laquelle envoyer le payeur. Renseignée uniquement quand
            l'opérateur exige une redirection. `null` sur un transfert.
          example: https://pay.example.com/s/abc123
        requiresPayerAction:
          type: boolean
          description: >
            `true` si l'encaissement attend une action du payeur sur `payerActionUrl`.
          example: true
        failure:
          type: [object, "null"]
          description: Renseigné uniquement si l'opération a échoué.
          properties:
            code:
              $ref: "#/components/schemas/OperationFailureCode"
            message:
              type: string
              example: Le solde du compte mobile money du payeur est insuffisant.
        metadata:
          type: [object, "null"]
          description: Vos données libres, restituées telles quelles.
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
          description: Horodatage du passage à un état définitif.
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: >
            Au-delà, une opération sans issue passe en `EXPIRED`. 30 minutes pour un
            encaissement, 6 heures pour un transfert.

    OperationEnvelope:
      type: object
      properties:
        operation:
          $ref: "#/components/schemas/Operation"

    Wallet:
      type: object
      properties:
        walletId:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        currency:
          $ref: "#/components/schemas/Currency"
        balance:
          type: integer
          description: Solde total détenu.
          example: 500000
        reserved:
          type: integer
          description: Part immobilisée par les transferts en cours.
          example: 20000
        available:
          type: integer
          description: >
            `balance − reserved` : ce que vous pouvez réellement engager dans un
            nouveau transfert.
          example: 480000
        status:
          type: string
          enum: [ACTIVE, FROZEN, CLOSED]
        totalCollected:
          type: integer
          description: Cumul encaissé depuis l'ouverture du compte.
        totalDisbursed:
          type: integer
          description: Cumul transféré depuis l'ouverture du compte.
        totalFees:
          type: integer
          description: Cumul des commissions prélevées.
        updatedAt:
          type: string
          format: date-time

    LedgerEntry:
      type: object
      description: >
        Ligne de relevé. Le relevé est en ajout seul : une ligne posée n'est jamais
        modifiée. Une correction prend la forme d'une écriture inverse.
      properties:
        id:
          type: string
          format: uuid
        sequence:
          type: integer
          description: >
            Rang de l'écriture dans votre relevé. Strictement croissant : c'est le
            bon critère de tri, pas l'horodatage.
          example: 1842
        direction:
          type: string
          description: |
            - `CREDIT` — le solde augmente
            - `DEBIT` — le solde diminue
            - `HOLD` — immobilisation : le solde ne bouge pas, le disponible diminue
            - `RELEASE` — levée d'immobilisation
          enum: [CREDIT, DEBIT, HOLD, RELEASE]
        kind:
          type: string
          description: |
            - `CASHIN_CREDIT` — encaissement confirmé
            - `CASHIN_FEE` — commission sur encaissement
            - `CASHOUT_HOLD` — immobilisation à la demande de transfert
            - `CASHOUT_DEBIT` — transfert exécuté
            - `CASHOUT_FEE` — commission sur transfert
            - `CASHOUT_RELEASE` — levée d'immobilisation
            - `REVERSAL_CREDIT` / `REVERSAL_DEBIT` — contre-passation
            - `ADJUSTMENT_CREDIT` / `ADJUSTMENT_DEBIT` — régularisation
          enum:
            [
              CASHIN_CREDIT,
              CASHIN_FEE,
              CASHOUT_HOLD,
              CASHOUT_DEBIT,
              CASHOUT_FEE,
              CASHOUT_RELEASE,
              REVERSAL_CREDIT,
              REVERSAL_DEBIT,
              ADJUSTMENT_CREDIT,
              ADJUSTMENT_DEBIT,
            ]
        amount:
          type: integer
          description: Toujours positif. Le sens est porté par `direction`.
          example: 4925
        currency:
          $ref: "#/components/schemas/Currency"
        balanceAfter:
          type: integer
          description: Solde après cette écriture — permet un rapprochement ligne à ligne.
          example: 504925
        reservedAfter:
          type: integer
          example: 20000
        operationReference:
          type: [string, "null"]
          example: GUI-CI-20261001-7K2M9QX4
        description:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time

    Merchant:
      type: object
      properties:
        reference:
          type: string
          description: Référence publique de votre compte.
          example: PRT-4F7K2M9Q
        name:
          type: string
          example: Wakati Technologies
        legalName:
          type: [string, "null"]
        email:
          type: string
          format: email
        phoneNumber:
          type: [string, "null"]
        country:
          $ref: "#/components/schemas/Country"
        status:
          type: string
          description: |
            - `PENDING` — créé, en attente d'activation : vous pouvez consulter et
              configurer, mais pas encore opérer
            - `ACTIVE` — opérationnel
            - `SUSPENDED` — bloqué temporairement
            - `CLOSED` — clôturé
          enum: [PENDING, ACTIVE, SUSPENDED, CLOSED]
        allowedCountries:
          type: array
          description: Pays ouverts sur votre compte.
          items:
            $ref: "#/components/schemas/Country"
        webhookUrl:
          type: [string, "null"]
        webhookSecretHint:
          type: [string, "null"]
          description: >
            Huit derniers caractères de votre secret de signature, pour vérifier que
            vous détenez bien la version courante après une rotation.
          example: 9f1c2b7e
        pricing:
          type: object
          properties:
            cashinFeeBps:
              type: integer
              description: Commission d'encaissement en points de base (150 = 1,5 %).
              example: 150
            cashinFeeFlat:
              type: integer
              description: Part fixe de la commission d'encaissement.
              example: 0
            cashoutFeeBps:
              type: integer
              example: 100
            cashoutFeeFlat:
              type: integer
              example: 0
        limits:
          type: object
          properties:
            minCashinAmount:
              type: integer
              example: 100
            maxCashinAmount:
              type: integer
              example: 2000000
            minCashoutAmount:
              type: integer
              example: 100
            maxCashoutAmount:
              type: integer
              example: 2000000
            dailyCashoutLimit:
              type: integer
              description: Plafond glissant de transfert sur 24 h. `0` = pas de plafond.
              example: 0
        metadata:
          type: [object, "null"]
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      description: Forme de toutes les réponses d'erreur.
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          properties:
            code:
              type: string
              description: >
                Code stable. **Branchez votre logique dessus**, jamais sur `message`,
                qui peut être reformulé.
              example: INSUFFICIENT_BALANCE
            message:
              type: string
              example: Le solde disponible de votre portefeuille est insuffisant.
            details:
              type: [object, "null"]
              description: Contexte complémentaire, variable selon le code.
              additionalProperties: true
        requestId:
          type: string
          description: Également renvoyé dans l'en-tête `x-request-id`.
          example: 9f1c2b7e-4a5d-4c8f-b0a1-e2d3c4b5a697
        timestamp:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Requête invalide (`VALIDATION_ERROR`, `IDEMPOTENCY_KEY_REQUIRED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: La requête est invalide.
              details:
                fields: ["amount must be an integer number"]
            requestId: 9f1c2b7e-4a5d-4c8f-b0a1-e2d3c4b5a697
            timestamp: "2026-10-01T10:12:04.000Z"
    Unauthorized:
      description: Identifiants absents ou invalides.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            success: false
            error:
              code: INVALID_CREDENTIALS
              message: Identifiants API invalides.
            requestId: 9f1c2b7e-4a5d-4c8f-b0a1-e2d3c4b5a697
            timestamp: "2026-10-01T10:12:04.000Z"
    Forbidden:
      description: >
        Compte non activé ou suspendu (`ACCOUNT_SUSPENDED`), adresse IP non déclarée
        (`IP_NOT_ALLOWED`), portefeuille gelé (`WALLET_FROZEN`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Ressource introuvable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >
        Clé d'idempotence réutilisée avec un corps différent
        (`IDEMPOTENCY_KEY_REUSED`), requête identique en cours
        (`IDEMPOTENT_REQUEST_IN_FLIGHT`), ou référence externe déjà prise
        (`DUPLICATE_EXTERNAL_REFERENCE`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentRequired:
      description: Solde disponible insuffisant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            success: false
            error:
              code: INSUFFICIENT_BALANCE
              message: Le solde disponible de votre portefeuille est insuffisant.
              details:
                available: 12000
                required: 25250
                currency: XOF
            requestId: 9f1c2b7e-4a5d-4c8f-b0a1-e2d3c4b5a697
            timestamp: "2026-10-01T10:12:04.000Z"
    Unprocessable:
      description: >
        Montant hors bornes, couple pays / opérateur indisponible, ou numéro invalide.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Débit dépassé.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: >
        Indisponibilité temporaire. **Réessayez avec la même clé d'idempotence** :
        l'opération n'a peut-être pas été enregistrée.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

webhooks:
  operationNotification:
    post:
      summary: Notification d'opération
      operationId: operationNotification
      tags: [Notifications]
      security: []
      description: |
        Requête que **Djonanko envoie à votre serveur** dès qu'une opération atteint un
        état définitif, ou qu'un encaissement attend une action du payeur.

        L'URL est celle configurée sur votre compte (`webhookUrl`), ou celle fournie
        dans `callbackUrl` à la création de l'opération.

        ### Vérifier la signature

        Deux en-têtes accompagnent chaque notification :

        ```
        Djonanko-Signature: t=1759226027,v1=3a7f…
        Djonanko-Event:     cashin.succeeded
        ```

        `v1` est un HMAC-SHA256 de la chaîne `<t>.<corps brut>`, calculé avec votre
        secret de signature. **Vérifiez-le sur le corps brut**, avant toute
        désérialisation : recalculer après avoir reparsé le JSON produit une chaîne
        différente et la vérification échouerait systématiquement.

        Comparez aussi `t` à l'heure courante et refusez au-delà de 5 minutes : c'est
        ce qui rend une notification capturée inexploitable.

        ### Ce que votre endpoint doit faire

        1. **Répondre 2xx en moins de 15 secondes.** Accusez réception, traitez ensuite
           en tâche de fond.
        2. **Être idempotent.** La livraison est garantie « au moins une fois » :
           dédupliquez sur `id`.
        3. **Être joignable en HTTPS.**

        ### En cas d'indisponibilité

        3 tentatives immédiates (2 s, 4 s, 8 s), puis des rejeux à 5 min, 15 min, 1 h,
        6 h et 24 h — un rattrapage sur environ 31 heures.

        Les codes `400`, `401`, `404`, `410` et `422` font abandonner immédiatement :
        ils ne se résoudront pas d'eux-mêmes. Un `403` est au contraire réessayé,
        parce que c'est typiquement un pare-feu applicatif devant votre serveur, que
        vous pouvez débloquer.

        <Warning>
        Les notifications ne sont pas la source de vérité. Si l'une vous échappe,
        `GET /operations/{reference}` donne toujours l'état réel. N'attendez jamais
        une notification indéfiniment : interrogez.
        </Warning>
      parameters:
        - name: Djonanko-Signature
          in: header
          required: true
          description: "`t=<horodatage unix>,v1=<hmac-sha256 hexadécimal>`"
          schema:
            type: string
            example: t=1759226027,v1=3a7f9c1e8b2d4f6a0c5e7b9d1f3a5c7e9b1d3f5a7c9e1b3d5f7a9c1e3b5d7f9a
        - name: Djonanko-Event
          in: header
          required: true
          description: Type de l'événement, pour router sans lire le corps.
          schema:
            type: string
            example: cashin.succeeded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Identifiant de l'événement. Utilisez-le pour dédupliquer.
                  example: evt_9f1c2b7e4a5d4c8fb0a1e2d3c4b5a697
                type:
                  type: string
                  description: |
                    - `cashin.awaiting_payer` — le payeur doit agir
                    - `cashin.succeeded` — encaissement confirmé, portefeuille crédité
                    - `cashin.failed` — encaissement refusé
                    - `cashin.expired` — aucune issue dans le délai
                    - `cashout.succeeded` — bénéficiaire crédité
                    - `cashout.failed` — transfert refusé, immobilisation levée
                    - `cashout.expired` — aucune issue, immobilisation levée
                    - `operation.reversed` — opération contre-passée
                    - `wallet.adjusted` — régularisation de portefeuille
                    - `ping` — notification de test
                  enum:
                    [
                      cashin.awaiting_payer,
                      cashin.succeeded,
                      cashin.failed,
                      cashin.expired,
                      cashout.succeeded,
                      cashout.failed,
                      cashout.expired,
                      operation.reversed,
                      wallet.adjusted,
                      ping,
                    ]
                createdAt:
                  type: string
                  format: date-time
                merchantReference:
                  type: string
                  example: PRT-4F7K2M9Q
                data:
                  type: object
                  description: >
                    Contenu de l'événement. Pour tous les types liés à une opération,
                    contient `operation`, dans la même forme que les réponses d'API.
                  properties:
                    operation:
                      $ref: "#/components/schemas/Operation"
            examples:
              encaissementReussi:
                summary: Encaissement confirmé
                value:
                  id: evt_9f1c2b7e4a5d4c8fb0a1e2d3c4b5a697
                  type: cashin.succeeded
                  createdAt: "2026-10-01T10:13:47.512Z"
                  merchantReference: PRT-4F7K2M9Q
